# Debian VM that gives an HP LaserJet Pro 200 color MFP M276nw its scanner back.
#
# The printer predates eSCL/AirScan, so macOS can no longer talk to it. HPLIP's
# hpaio backend still speaks HP's proprietary SOAP scan protocol (TCP 8289), so
# we run that inside Linux.
#
# This file defines the VM only. `scanner` creates it on demand; software setup
# lives in provision/ and is applied over stdin by lib/vm.sh.

# Only the image defaults. Deliberately NOT template:_default/mounts -- that base
# mounts the home directory, which this VM has no need to see.
base:
  - template:_images/debian-13

vmType: vz
arch: aarch64

cpus: 2
memory: "2GiB"
disk: "16GiB"

# vzNAT gives the guest outbound access to the physical LAN so it can reach the
# printer, and a stable address on the host's 192.168.64.0/24 vmnet.
#
# Note the guest still cannot do mDNS -- multicast does not cross this boundary,
# which is why all discovery happens host-side and only an IPv4 address is passed in.
networks:
  - vzNAT: true


# No mounts at all. Provisioning scripts are piped in over stdin and scans come
# back via `limactl copy`, so the VM has no dependency on where this repo lives --
# which is what lets it be created from scratch on another machine.
mounts: []
